<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kassya & Alana - Memórias</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a0f1a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #f7d6b5;
        }
        
        /* Container proporção exata da sua imagem (Mobile-First) */
        #game-container {
            width: 100vw;
            height: calc(100vw * (1414 / 1000)); /* Mantém a proporção da arte 1000x1414 */
            max-width: 450px;
            max-height: 636px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
            background-image: url('https://Neves3012.github.io/k/image_0e219e.jpg'); /* Carrega sua imagem direto do repositório */
            background-size: cover;
            background-position: center;
        }

        /* Estrelas discretas no topo */
        #ui-top {
            position: absolute;
            top: 12px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .stars-row {
            font-size: 18px;
            letter-spacing: 3px;
        }
        .star {
            color: rgba(255, 255, 255, 0.2);
            text-shadow: 1px 1px 2px #000;
        }
        .star.active {
            color: #ffcc00;
            text-shadow: 0 0 8px #ff9900, 1px 1px 2px #000;
        }

        /* Camada interativa invisível que acompanha o tamanho da imagem */
        #interactive-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Brilho Âmbar sobre os objetos desenhados */
        #amber-glow {
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255, 140, 0, 0.4);
            box-shadow: 0 0 15px 12px rgba(255, 120, 0, 0.35);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3;
            display: block;
            animation: pulseGlow 1.2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* Botões invisíveis exatamente em cima dos itens da imagem */
        .click-zone {
            position: absolute;
            width: 45px;
            height: 45px;
            transform: translate(-50%, -50%);
            z-index: 4;
            pointer-events: none;
        }
        .click-zone.active {
            pointer-events: auto;
        }

        /* Posições milimetricamente ajustadas com base no seu mapa visual (%) */
        #obj-1 { top: 26.5%; left: 19.5%; } /* Celular */
        #obj-2 { top: 27.5%; left: 13.5%; } /* Cupuaçuzinho */
        #obj-3 { top: 25.5%; left: 10.5%; } /* Caneca */
        #obj-4 { top: 17.5%; left: 19.5%; } /* Lírios */
        #obj-5 { top: 22.5%; left: 83.5%; } /* Música */
        #obj-6 { top: 9.0%; left: 83.5%; }  /* PC */
        #obj-7 { top: 8.5%; left: 43.5%; }  /* Livro */
        #obj-8 { top: 26.5%; left: 63.5%; } /* Camisa */
        #obj-9 { top: 10.5%; left: 21.5%; } /* Janela */

        /* Caixa de diálogo retrô idêntica ao estilo cozy */
        #memory-box {
            position: absolute;
            bottom: 15px;
            left: 5%;
            width: 90%;
            background: #231221;
            border: 3px solid #f7d6b5;
            border-radius: 6px;
            padding: 15px;
            display: none;
            z-index: 20;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            max-height: 50%;
            overflow-y: auto;
        }
        .mem-title {
            font-size: 12px;
            color: #ffaa00;
            margin-bottom: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .mem-date {
            font-size: 10px;
            color: #a47599;
            margin-bottom: 8px;
        }
        .mem-body {
            font-size: 13px;
            line-height: 1.5;
            color: #f7d6b5;
            white-space: pre-line;
        }
        .btn-next {
            display: block;
            margin-top: 12px;
            background: #4a2840;
            color: #f7d6b5;
            border: 1px solid #ffaa00;
            padding: 6px;
            text-align: center;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .chat-row { margin-bottom: 6px; }
        .alana { color: #ff9ebb; font-weight: bold; }
        .kassya-name { color: #9ebeff; font-weight: bold; }
        .footer-note { font-size: 10px; color: #8a6382; text-align: center; margin-top: 10px; font-style: italic; }
        .list-item { margin-left: 5px; margin-top: 3px; color: #f2c194; }
        .final-heart { text-align: center; color: #ff3366; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-top">
        <div class="stars-row">
            <span class="star" id="s1">★</span>
            <span class="star" id="s2">★</span>
            <span class="star" id="s3">★</span>
            <span class="star" id="s4">★</span>
            <span class="star" id="s5">★</span>
            <span class="star" id="s6">★</span>
            <span class="star" id="s7">★</span>
            <span class="star" id="s8">★</span>
            <span class="star" id="s9">★</span>
        </div>
    </div>

    <div id="interactive-layer" onclick="handleMapTap(event)">
        <div id="amber-glow"></div>

        <!-- Personagem chibi visível -->
        <div id="kassya" style="top:75%; left:50%;"></div>

        <div class="click-zone" id="obj-1"></div>
        <div class="click-zone" id="obj-2"></div>
        <div class="click-zone" id="obj-3"></div>
        <div class="click-zone" id="obj-4"></div>
        <div class="click-zone" id="obj-5"></div>
        <div class="click-zone" id="obj-6"></div>
        <div class="click-zone" id="obj-7"></div>
        <div class="click-zone" id="obj-8"></div>
        <div class="click-zone" id="obj-9"></div>
    </div>

    <div id="memory-box">
        <div class="mem-title" id="m-title"></div>
        <div class="mem-date" id="m-date"></div>
        <div class="mem-body" id="m-body"></div>
        <div class="btn-next" onclick="closeMemoryBox()">Seguir em frente... ❤️</div>
    </div>
</div>

<script>
    let currentStep = 1;
    const totalSteps = 9;
    let isMoving = false;

    // Estilo e comportamento do personagem (CSS via JS-inserted class fallback se necessário)
    (function insertKassyaStyles(){
        const s = document.createElement('style');
        s.textContent = `#kassya{position:absolute;width:38px;height:58px;background:#d49387;border:3px solid #1a0f1a;border-radius:16px 16px 6px 6px;z-index:6;transform:translate(-50%,-100%);transition:top 0.7s ease,left 0.7s ease;box-shadow:0 8px 4px rgba(0,0,0,0.6);}#kassya::before{content:'';position:absolute;top:-8px;left:-4px;width:46px;height:26px;background:#543129;border-radius:12px;border:3px solid #1a0f1a;z-index:-1;}#kassya::after{content:'KASSYA';position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:#4a2840;color:#f7d6b5;font-size:9px;font-weight:bold;padding:1px 6px;border-radius:3px;border:1px solid #bfa3bb;letter-spacing:1px;}`;
        document.head.appendChild(s);
    })();

    const memoryData = {
        1: {
            title: "Celular",
            date: "24/11/2025",
            html: `<div class="chat-row"><span class="alana">Alana:</span> “Assiste animais fantásticos. É MUITO BOM!! TE DOU MINHA PALAVRA DE ESCOTEIRA.”</div>
                   <div class="chat-row"><span class="kassya-name">Kassya:</span> “Pera, tu já foi real escoteira?”</div>
                   <div class="chat-row"><span class="alana">Alana:</span> “Não! Mas tenho a palavra deles.”</div>
                   <div class="footer-note">registrada para fins históricos 🤡</div>`
        },
        2: {
            title: "Cupuaçuzinho",
            date: "",
            html: `“MEU CUPUAÇUZINHO...”`
        },
        3: {
            title: "Caneca",
            date: "Dias comuns / rotina",
            html: `“Eu gosto das coisas grandes.\nMas acho que gosto ainda mais da idea dos dias comuns com você.”\n\n<div class="list-item">• mandar meme no expediente</div><div class="list-item">• escolher comida por 40 minutos</div><div class="list-item">• reclamar do sono</div><div class="list-item">• dividir silêncio confortável</div>\n<b>“Talvez casa também seja isso.”</b>`
        },
        4: {
            title: "Lírios",
            date: "28/01/2026",
            html: `“Uma vez você me disse que gostaria de ter flores em casa quando se mudar.\n\nEu não acho que precisamos esperar as condições perfeitas para fazer o que gostamos.\n\nSempre é tempo de criar novas tradições.”`
        },
        5: {
            title: "Música",
            date: "",
            html: `“Se carinho tivesse som, talvez fosse esse.”\n\nMúsica associada: <b>Seu Balancê</b>`
        },
        6: {
            title: "PC",
            date: "",
            html: `“Talvez você nunca veja as horas escondidas por trás disso.\nMas elas sempre foram suas.”\n\n<span style="color: #ff9ebb;">[Mostrando ilustração de Alana programando]</span>`
        },
        7: {
            title: "Livro",
            date: "27/12/2025",
            html: `<span style="color: #ff9ebb;">[Imagem: Kassya deitada com camisa do Flamengo]</span>\n\nLegenda: “Não é o seuuuuuu cheiro especificamente, mas ta bom demais.”\n\n“Talvez amor também seja isso: encontrar conforto no que lembra alguém.”`
        },
        8: {
            title: "Camisa",
            date: "",
            html: `Texto na camisa: <i>“Dizem que o amor atrai”</i>\n\n“Tem coisas que carregam presença mesmo quando falta abraço.”`
        },
        9: {
            title: "Janela (Final)",
            date: "Ainda por viver",
            html: `<b>Coisas que ainda quero viver com você:</b>\n\n<div class="list-item">• ter flores em casa</div><div class="list-item">• cozinhar juntas e errar a receita</div><div class="list-item">• um domingo sem pressa</div><div class="list-item">• viagem improvisada</div><div class="list-item">• dormir vendo algo juntas</div><div class="list-item">• reclamar do sono tomando café</div><div class="list-item">• dividir silêncio confortável</div>\n<div class="final-heart">“Ainda tem tanta coisa esperando pela gente.” ❤️</div>`
        }
    };

    function updateGlowPosition() {
        if (currentStep <= totalSteps) {
            const targetObj = document.getElementById(`obj-${currentStep}`);
            const glow = document.getElementById('amber-glow');
            
            document.querySelectorAll('.click-zone').forEach(obj => obj.classList.remove('active'));
            targetObj.classList.add('active');

            glow.style.top = targetObj.style.top;
            glow.style.left = targetObj.style.left;
            glow.style.display = 'block';
        } else {
            document.getElementById('amber-glow').style.display = "none";
        }
    }

    function handleMapTap(event) {
        if (document.getElementById('memory-box').style.display === 'block' || isMoving) return;

        const layer = document.getElementById('interactive-layer');
        const rect = layer.getBoundingClientRect();
        
        const tapX = ((event.clientX - rect.left) / rect.width) * 100;
        const tapY = ((event.clientY - rect.top) / rect.height) * 100;

        const kassya = document.getElementById('kassya');
        // move personagem até o ponto tocado
        isMoving = true;
        kassya.style.left = `${tapX}%`;
        kassya.style.top = `${tapY}%`;

        const targetObj = document.getElementById(`obj-${currentStep}`);
        const objX = parseFloat(targetObj.style.left);
        const objY = parseFloat(targetObj.style.top);

        const distance = Math.sqrt(Math.pow(tapX - objX, 2) + Math.pow(tapY - objY, 2));

        // após movimento (durar 700ms por CSS), verifica se estava perto o suficiente
        setTimeout(() => {
            isMoving = false;
            if (distance < 8) {
                // centraliza exatamente no objeto antes de abrir
                kassya.style.left = `${objX}%`;
                kassya.style.top = `${objY}%`;
                setTimeout(openMemoryBox, 250);
            }
        }, 750);
    }

    function openMemoryBox() {
        const data = memoryData[currentStep];
        document.getElementById('m-title').innerHTML = data.title;
        document.getElementById('m-date').innerHTML = data.date;
        document.getElementById('m-body').innerHTML = data.html;
        document.getElementById('memory-box').style.display = 'block';
    }

    function closeMemoryBox() {
        document.getElementById('memory-box').style.display = 'none';
        document.getElementById(`s${currentStep}`).classList.add('active');
        
        currentStep++;
        updateGlowPosition();
    }

    window.onload = () => {
        updateGlowPosition();
    };
</script>

</body>
</html>
